# ClinicCare Nginx Configuration
# Handles:
#   - Main app at patientplex.ai / app.patientplex.ai
#   - Doctor landing pages at *.patientplex.ai (wildcard subdomain)
#   - API proxy to FastAPI backend
#   - SSL termination (configure cert paths)

# Upstream servers
upstream backend {
    server 127.0.0.1:8000;
}

upstream frontend {
    server 127.0.0.1:3000;
}

# --- Main app: app.patientplex.ai ---
server {
    listen 80;
    server_name patientplex.ai app.patientplex.ai www.patientplex.ai;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # API proxy
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # CORS headers (handled by FastAPI, but just in case)
        add_header Access-Control-Allow-Origin * always;
    }

    # WhatsApp webhook — no auth, needs to be fast
    location /api/v1/whatsapp/webhook {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# --- Doctor landing pages: *.patientplex.ai ---
server {
    listen 80;
    server_name ~^(?<subdomain>.+)\.patientplex\.ai$;

    # Proxy to FastAPI landing page endpoint
    # The URL /api/v1/landing/preview/{slug} serves the HTML
    location / {
        proxy_pass http://backend/api/v1/landing/preview/$subdomain$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache landing pages for 5 minutes
        proxy_cache_valid 200 5m;
    }

    # Treatment pages: dr-name.patientplex.ai/braces
    location ~ ^/([a-z0-9-]+)$ {
        proxy_pass http://backend/api/v1/landing/preview/$subdomain/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

