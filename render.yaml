# PatientPlex AI — Render Infrastructure-as-Code
# Deploy: Connect this repo to Render, it auto-detects render.yaml

services:
  - type: web
    name: patientplex-ai-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patientplex-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
    plan: starter
    region: singapore

databases:
  - name: patientplex-db
    plan: starter
    postgresMajorVersion: 16
    region: singapore
