name: Extract code
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          tar xzf "PatientPlex-AI-Final (1).tar.gz"
          cp -r cliniccare/* .
          cp cliniccare/.gitignore . 2>/dev/null || true
          rm -rf cliniccare "PatientPlex-AI-Final (1).tar.gz"
          rm -rf .github/workflows/extract.yml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "PatientPlex AI source code"
          git push
