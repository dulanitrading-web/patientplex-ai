name: Frontend dependency candidate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-candidate.yml'
permissions:
  contents: read
jobs:
  resolve:
    if: github.head_ref == 'patientplex-v2/integration'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve pinned candidate
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@16.4.6
          npm install --package-lock-only --ignore-scripts --save-exact react@19 react-dom@19
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint@9 @types/react@19 @types/react-dom@19
          npm pkg set 'scripts.lint=eslint .'
          npm ci
      - name: Check types
        run: npx tsc --noEmit
      - name: Lint
        if: always()
        run: npm run lint
      - name: Build
        if: always()
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      - name: Audit
        if: always()
        run: npm audit --audit-level=moderate
      - name: Preserve generated dependency files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
