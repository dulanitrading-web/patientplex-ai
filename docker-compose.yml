version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      # PRODUCTION: Override these in .env — never use defaults in production
      POSTGRES_USER: ${POSTGRES_USER:-cliniccare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliniccare_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cliniccare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniccare"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # PRODUCTION: Override DATABASE_URL and SECRET_KEY in .env
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cliniccare:cliniccare_dev_2026@db:5432/cliniccare}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      CALCOM_API_KEY: ${CALCOM_API_KEY:-}
      CALCOM_BASE_URL: ${CALCOM_BASE_URL:-https://api.cal.com/v1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cliniccare:cliniccare_dev_2026@db:5432/cliniccare}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: python -m app.workers
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  pgdata:
